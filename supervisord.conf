[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:gunicorn]
command=gunicorn CPAM.wsgi:application
    --bind 127.0.0.1:8000
    --workers 4
    --timeout 120
    --access-logfile -
    --error-logfile -
directory=/app/backend
environment=
    PYTHONPATH="/app/backend",
    SECRET_KEY="%(ENV_SECRET_KEY)s",
    DEBUG="%(ENV_DEBUG)s",
    ALLOWED_HOSTS="%(ENV_ALLOWED_HOSTS)s",
    DATABASE_URL="%(ENV_DATABASE_URL)s",
    CORS_ALLOWED_ORIGINS="%(ENV_CORS_ALLOWED_ORIGINS)s"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
depends_on=gunicorn
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
