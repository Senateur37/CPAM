# ================================================================
#  CPAM — docker-compose.yml pour Coolify
#
#  ► UN seul service "app" (Frontend + Backend dans le même conteneur)
#  ► La base de données PostgreSQL est gérée par Coolify séparément
#    → Dans Coolify : créer une ressource PostgreSQL, puis copier
#      l'URL de connexion dans la variable DATABASE_URL ci-dessous
# ================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      # Médias uploadés (photos, fichiers…) — persistant
      - media_data:/app/backend/media

volumes:
  media_data:
